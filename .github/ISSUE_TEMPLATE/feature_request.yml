name: Feature request
description: Suggest a skill, integration or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should JARVIS be able to do?
      description: Example phrases you would say are very helpful ("remind me when …", "play my morning playlist").
    validations: { required: true }
  - type: textarea
    id: how
    attributes:
      label: Ideas for how
      description: A free, key-less API? A macOS feature? Could it be a plugin (see plugins/README.md)?
