name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The fastest way to get help: run **`npm run doctor`** and paste its output below.
        (It is the same self-check as the SYSTEMS button in the console.)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you say/type, what did you expect, what happened instead?
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: "`npm run doctor` output"
      render: text
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS · Node version · browser
      placeholder: "macOS 15 · Node 22.12 · Chrome 131"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Terminal output / logs
      description: Anything printed where you ran `npm start` (look for lines starting with `[Kokoro]`, `[WARN]`, `[ERROR]`), or `logs/jarvis.log`.
      render: text
