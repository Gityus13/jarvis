name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # macOS-only code paths are best-effort in CI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # optional deps (kokoro-js ≈ 200 MB, robotjs native build) are not needed: tests use fakes
      - run: npm ci --omit=optional
      - name: Syntax check
        shell: bash
        run: |
          for f in server.js src/*.js src/skills/*.js public/js/*.js scripts/*.js plugins/*.js test/*.js; do node --check "$f"; done
          bash -n setup.sh && bash -n setup-permissions.sh
      - run: npm test
